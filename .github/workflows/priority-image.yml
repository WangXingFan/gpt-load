name: Priority routing image

on:
  push:
    branches: [feat/group-priority]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: priority-image-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org|direct
  GOFLAGS: -p=2

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/web-ci
      - name: Export formatting corrections on failure
        if: failure()
        run: |
          pnpm --dir web exec prettier --write .
          git diff --binary > web-format.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: web-format
          path: web-format.patch

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Format Go source
        run: |
          gofmt -w $(git ls-files '*.go')
          git diff --binary > go-format.patch
      - name: Run backend race tests
        run: go test -race -count=1 -timeout=30m . ./internal/...
      - name: Check module graph and vet
        run: |
          go mod tidy -diff
          go vet ./...
      - name: Validate embedded CPA bridge
        working-directory: third_party/cpaembedded
        run: |
          go mod tidy -diff
          go test -race -count=1 -timeout=15m ./...
          go vet ./...
      - name: Check formatting and whitespace
        run: |
          git diff --exit-code
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: go-format
          path: go-format.patch

  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: postgres
            image: postgres:18
            port: 5432
            health: pg_isready -U postgres -d gpt_load
            dsn: postgres://postgres:postgres@127.0.0.1:{0}/gpt_load?sslmode=disable
          - driver: mysql
            image: mysql:8.4
            port: 3306
            health: mysqladmin ping -h 127.0.0.1 -proot
            dsn: mysql://root:root@127.0.0.1:{0}/gpt_load?charset=utf8mb4
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gpt_load
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gpt_load
        ports:
          - ${{ matrix.port }}
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s --health-timeout=10s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify upgrade preserves existing data
        env:
          GPT_LOAD_DATABASE_TEST_DSN: ${{ format(matrix.dsn, job.services.database.ports[format('{0}', matrix.port)]) }}
        run: go test -count=1 -timeout=20m ./internal/storage -run 'TestExternalGroupPriorityMigrationPreservesExistingData'

  image:
    needs: [web, backend, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:priority
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: VERSION=2.0.0-priority.${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summarize image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Image: ${IMAGE}:priority" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
